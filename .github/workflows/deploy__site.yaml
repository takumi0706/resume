name: deploy__site

# main への push でデプロイする。
# build__site が PR で型検査・ビルド・リンク検査を済ませている前提だが、
# デプロイ前にもう一度通す。壊れたものを公開しないことの方が、
# 数十秒の短縮より重要。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# デプロイの同時実行を防ぐ。後勝ちで壊れるのを避けるため、
# 実行中のものはキャンセルしない。
concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # environment を宣言すると GitHub が Deployment オブジェクトを作り、
      # リポジトリのサイドバーに Deployments カードとデプロイ履歴が出る。
      # cloudflare/wrangler-action はこれを自前では作らない。
      deployments: write

    # 独自ドメインを取ったら url を差し替える。
    environment:
      name: production
      url: https://takumi0706.ganndamu0706.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Check internal links
        run: pnpm run check:links

      # 訳が無いときは日本語にフォールバックするので、英語ページだけが日本語のまま
      # 出ても日本語ページを見ている限り気づけない。ここで落とす。
      - name: Check translations
        run: pnpm run check:i18n

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ビルド済みの dist を上げるだけ。ここで再ビルドはしない。
          command: deploy
